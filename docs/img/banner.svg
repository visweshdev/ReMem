<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="ReMem: memory for AI agents that learns what actually helps">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2f26"/>
      <stop offset="1" stop-color="#1f5c48"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.45" r="0.45">
      <stop offset="0" stop-color="#6fd3a2" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6fd3a2" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#glow)"/>

  <!-- memory graph motif: bright nodes are memories that helped, faded ones were demoted, crossed one was superseded -->
  <g stroke="#9fe3c2" stroke-opacity="0.35" stroke-width="2" fill="none">
    <path d="M820 150 L905 90 L1010 120 L1080 70"/>
    <path d="M820 150 L900 215 L1000 190 L1090 230"/>
    <path d="M905 90 L1000 190"/>
    <path d="M1010 120 L1090 160 L1090 230"/>
  </g>
  <g>
    <circle cx="820" cy="150" r="17" fill="#6fd3a2"/>
    <circle cx="905" cy="90" r="12" fill="#6fd3a2"/>
    <circle cx="1010" cy="120" r="21" fill="#6fd3a2"/>
    <circle cx="1080" cy="70" r="8" fill="#6fd3a2" fill-opacity="0.35"/>
    <circle cx="900" cy="215" r="9" fill="#6fd3a2" fill-opacity="0.35"/>
    <circle cx="1000" cy="190" r="14" fill="#6fd3a2"/>
    <circle cx="1090" cy="160" r="10" fill="#6fd3a2" fill-opacity="0.6"/>
    <circle cx="1090" cy="230" r="11" fill="none" stroke="#f2b8a0" stroke-width="2.5"/>
    <path d="M1082 222 L1098 238 M1098 222 L1082 238" stroke="#f2b8a0" stroke-width="2.5"/>
  </g>

  <text x="64" y="132" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="78" font-weight="700" fill="#ffffff">ReMem</text>
  <text x="66" y="182" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" fill="#d6efe4">Memory for AI agents that learns what actually helps</text>
  <text x="66" y="232" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" fill="#9fc9b6">add  ·  search  ·  feedback  →  better recall, outdated facts retired, smaller context</text>
</svg>
