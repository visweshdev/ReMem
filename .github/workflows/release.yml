name: build distribution

on:
  pull_request:
  workflow_dispatch:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify tag version
        if: github.ref_type == 'tag'
        run: |
          python - <<'PY'
          import os, tomllib
          with open("pyproject.toml", "rb") as file:
              version = tomllib.load(file)["project"]["version"]
          if os.environ["GITHUB_REF_NAME"] != f"v{version}":
              raise SystemExit(f"Expected release tag v{version}")
          PY
      - name: Build wheel and source archive
        run: |
          python -m pip install build twine
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) python -m build
          python -m twine check --strict dist/*
          (cd dist && sha256sum * > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: distribution
          path: dist/
          if-no-files-found: error

  clean-install:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        distribution: [wheel, sdist]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: distribution
          path: dist
      - name: Install the built artifact and exercise the CLI
        shell: bash
        run: |
          set -eu
          if [ '${{ matrix.distribution }}' = 'wheel' ]; then
            python -m pip install dist/*.whl
          else
            python -m pip install dist/*.tar.gz
          fi
          python -m pip check
          python -c 'from importlib.metadata import version; import remem; assert version("remem") == remem.__version__; m = remem.ReMem(); ident = m.add("Billing lives in Dublin"); assert m.search("Where is billing?").items[0].id == ident'
          remem demo

  publish:
    if: github.ref_type == 'tag'
    needs: clean-install
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distribution
          path: dist
      - name: Publish verified artifacts on GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum --check SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
