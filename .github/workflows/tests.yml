name: tests

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - name: Ruff
        run: ruff check .

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (core only, no optional extras)
        run: python -m pip install . pytest
      - name: Unit and integration tests
        run: python -m pytest tests -q
      - name: Command-line tool
        run: remem demo

  optional-integrations:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - extras: mcp
            imports: mcp
            mcp-version: latest
          - extras: mcp
            imports: mcp
            mcp-version: v1
          - extras: langchain
            imports: langchain_core
          - extras: faiss
            imports: faiss
          - extras: chroma
            imports: chromadb
          - extras: "mcp,langchain,tokenizer,llm"
            imports: "mcp, langchain_core, tiktoken, openai"
          - extras: "faiss,chroma,embeddings"
            imports: "faiss, chromadb, sentence_transformers"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - if: matrix.mcp-version == 'v1'
        run: python -m pip install ".[mcp]" "mcp<2" pytest
      - if: matrix.mcp-version != 'v1'
        run: python -m pip install ".[${{ matrix.extras }}]" pytest
      - run: python -m pip check
      - run: python -c "import ${{ matrix.imports }}"
      - run: python -m pytest tests/test_api_mcp.py tests/test_extensions.py -q -rs

  dev-simulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install ".[plots]" pytest
      - name: Simulator tests
        run: python -m pytest dev/tests -q -p no:cacheprovider
      - name: Simulator smoke run
        run: python dev/experiments/run_benchmark.py --quick --workers 2 --out /tmp/remem-smoke
