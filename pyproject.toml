[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "remem"
version = "0.1.0"
description = "Outcome-aware adaptive memory for long-horizon AI agents: utility learned from use, supersession, retention and token-budgeted retrieval"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Viswesh Kesarla", email = "visweshkesarla@gmail.com" }]
keywords = ["llm", "agents", "memory", "retrieval", "rag"]
dependencies = ["numpy>=1.26", "pyyaml>=6.0", "matplotlib>=3.7"]

[project.optional-dependencies]
claude = ["anthropic>=0.40"]                # remem.claude_agent: Claude as the evaluation agent
llm = ["openai>=1.50"]                       # remem.llm: real-model agent / embeddings / fact extraction
mcp = ["mcp>=1.2"]                           # remem-mcp server
embeddings = ["sentence-transformers>=2.2"]  # local neural embeddings
faiss = ["faiss-cpu>=1.8"]
chroma = ["chromadb>=0.5"]
tokenizer = ["tiktoken>=0.6"]
all = ["anthropic>=0.40", "openai>=1.50", "mcp>=1.2", "sentence-transformers>=2.2", "faiss-cpu>=1.8", "chromadb>=0.5", "tiktoken>=0.6"]
dev = ["pytest>=8.0"]

[project.scripts]
remem-mcp = "remem.mcp_server:main"

[tool.setuptools.packages.find]
include = ["remem*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
